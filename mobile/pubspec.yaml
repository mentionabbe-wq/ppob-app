name: ppob_app
description: Aplikasi jualan pulsa & PPOB.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  # Model ditulis manual (tanpa freezed/build_runner) agar proyek
  # langsung bisa dijalankan setelah `flutter pub get`.
  flutter_riverpod: ^2.5.1

  # Jaringan
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Navigasi
  go_router: ^14.2.7

  # Penyimpanan
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0
  pin_code_fields: ^8.0.1
  lottie: ^3.1.2

  # Utilitas
  intl: ^0.19.0
  uuid: ^4.5.1
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  open_filex: ^4.5.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  package_info_plus: ^8.0.2

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # Google Sign-In (opsional)
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
