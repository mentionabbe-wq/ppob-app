; Konfigurasi Supervisor untuk deployment TANPA Docker.
; Salin ke /etc/supervisor/conf.d/ppob.conf lalu:
;   sudo supervisorctl reread && sudo supervisorctl update

; Antrean topup dipisah agar pembelian pengguna tidak pernah
; mengantre di belakang job sinkronisasi katalog yang panjang.
[program:ppob-topup]
process_name=%(program_name)s_%(process_num)02d
command=php /opt/ppob/backend/artisan queue:work redis --queue=topup --tries=3 --backoff=10,30,120 --max-time=3600 --sleep=1
directory=/opt/ppob/backend
autostart=true
autorestart=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/ppob/queue-topup.log
stopwaitsecs=3600

[program:ppob-default]
process_name=%(program_name)s_%(process_num)02d
command=php /opt/ppob/backend/artisan queue:work redis --queue=notifications,maintenance,default --tries=3 --max-time=3600
directory=/opt/ppob/backend
autostart=true
autorestart=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/ppob/queue-default.log
stopwaitsecs=3600

; ALTERNATIF: pakai Horizon sebagai pengganti kedua program di atas —
; jangan aktifkan bersamaan, karena job akan diproses dua kali.
; Bila memilih Horizon, nonaktifkan ppob-topup & ppob-default,
; lalu atur jumlah proses di backend/config/horizon.php.
;
; [program:ppob-horizon]
; command=php /opt/ppob/backend/artisan horizon
; directory=/opt/ppob/backend
; autostart=true
; autorestart=true
; user=www-data
; redirect_stderr=true
; stdout_logfile=/var/log/ppob/horizon.log
; stopwaitsecs=3600

[group:ppob]
programs=ppob-topup,ppob-default
