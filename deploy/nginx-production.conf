# Nginx di host VPS: terminasi TLS + reverse proxy ke container.
# Salin ke /etc/nginx/sites-available/ppob lalu buat symlink ke sites-enabled.
#
# Blok ssl_certificate diisi otomatis oleh:  certbot --nginx -d api.domain-anda.id

# Batasi percobaan login agar brute force tidak sampai ke PHP.
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name api.domain-anda.id;

    # Selain tantangan ACME, semua dialihkan ke HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.domain-anda.id;

    ssl_certificate     /etc/letsencrypt/live/api.domain-anda.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.domain-anda.id/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 12M;

    access_log /var/log/nginx/ppob-access.log;
    error_log  /var/log/nginx/ppob-error.log warn;

    location /admin/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    # Dashboard antrean hanya dari jaringan internal/VPN.
    location /horizon {
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 120s;
    }
}
